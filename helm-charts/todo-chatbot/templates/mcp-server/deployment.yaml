apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-chatbot.mcpserver.fullname" . }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    component: mcp-server
spec:
  {{- if not (index .Values "mcp-server" "autoscaling" "enabled") }}
  replicas: {{ index .Values "mcp-server" "replicaCount" }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "todo-chatbot.selectorLabels" . | nindent 6 }}
      component: mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      {{- with index .Values "mcp-server" "podAnnotations" }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "todo-chatbot.selectorLabels" . | nindent 8 }}
        component: mcp-server
    spec:
      {{- with index .Values "mcp-server" "imagePullSecrets" }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml (index .Values "mcp-server" "podSecurityContext") | nindent 8 }}
      containers:
        - name: mcp-server
          securityContext:
            {{- toYaml (index .Values "mcp-server" "securityContext") | nindent 12 }}
          image: "{{ index .Values "mcp-server" "image" "repository" }}:{{ index .Values "mcp-server" "image" "tag" | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ index .Values "mcp-server" "service" "targetPort" }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ index .Values "mcp-server" "env" "PORT" | quote }}
            - name: LOG_LEVEL
              value: {{ index .Values "mcp-server" "env" "LOG_LEVEL" | quote }}
            - name: DATABASE_URL
              value: {{ index .Values "mcp-server" "env" "DATABASE_URL" | quote }}
          livenessProbe:
            httpGet:
              path: {{ index .Values "mcp-server" "livenessProbe" "path" }}
              port: http
            initialDelaySeconds: {{ index .Values "mcp-server" "livenessProbe" "initialDelaySeconds" }}
            periodSeconds: {{ index .Values "mcp-server" "livenessProbe" "periodSeconds" }}
            timeoutSeconds: {{ index .Values "mcp-server" "livenessProbe" "timeoutSeconds" }}
            failureThreshold: {{ index .Values "mcp-server" "livenessProbe" "failureThreshold" }}
          readinessProbe:
            httpGet:
              path: {{ index .Values "mcp-server" "readinessProbe" "path" }}
              port: http
            initialDelaySeconds: {{ index .Values "mcp-server" "readinessProbe" "initialDelaySeconds" }}
            periodSeconds: {{ index .Values "mcp-server" "readinessProbe" "periodSeconds" }}
            timeoutSeconds: {{ index .Values "mcp-server" "readinessProbe" "timeoutSeconds" }}
            failureThreshold: {{ index .Values "mcp-server" "readinessProbe" "failureThreshold" }}
          resources:
            {{- toYaml (index .Values "mcp-server" "resources") | nindent 12 }}
      {{- with index .Values "mcp-server" "nodeSelector" }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with index .Values "mcp-server" "affinity" }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with index .Values "mcp-server" "tolerations" }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
