apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-chatbot.mcp-server.fullname" . }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    component: mcp-server
spec:
  type: {{ .Values.mcp-server.service.type }}
  ports:
    - port: {{ .Values.mcp-server.service.port }}
      targetPort: {{ .Values.mcp-server.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "todo-chatbot.selectorLabels" . | nindent 4 }}
    component: mcp-server
