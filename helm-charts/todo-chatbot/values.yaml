# Global configuration
global:
  environment: dev
  imagePullPolicy: IfNotPresent

# Backend configuration
backend:
  enabled: true
  replicaCount: 3
  image:
    repository: phaseiv-backend
    tag: latest
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    AUTH_SERVICE_URL: https://fozi07-todo-full-stack-app.hf.space
    LOG_LEVEL: info
    PORT: "8000"
    DATABASE_URL: postgresql+asyncpg://neondb_owner:npg_fiR5GnczZYI4@ep-summer-firefly-a78vco82-pooler.ap-southeast-2.aws.neon.tech/neondb
    GEMINI_API_KEY: AIzaSyBJlCiIYkGAzwTs6UaZ0RnS9J4XDW3e11c
    MCP_SERVER_URL: http://mcp-server:8002
    SECRET_KEY: 47fa85fedc6d1dd46053ff3f5618f191
    OPENAI_MODEL: gemini-2.5-flash
  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: false
  podAnnotations: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: phaseiv-frontend
    tag: latest
  service:
    type: NodePort
    port: 80
    targetPort: 3000
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  env:
    BACKEND_URL: http://todo-chatbot-backend
    PORT: "3000"
    NEXT_PUBLIC_AUTH_SERVICE_URL: https://fozi07-todo-full-stack-app.hf.space/
  livenessProbe:
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: false
  podAnnotations: {}
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
