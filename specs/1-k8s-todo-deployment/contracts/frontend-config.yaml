## Environment Variables

### Required Variables

| Variable | Value | Description | Source |
|----------|-------|-------------|--------|
| `BACKEND_URL` | `http://todo-chatbot-backend` | Backend service URL (internal cluster DNS) | Helm template |
| `PORT` | `3000` | Application listening port | Helm values |

### Optional Variables

| Variable | Default | Description | Source |
|----------|---------|-------------|--------|
| `NODE_ENV` | `production` | Node.js environment | Helm values |
| `LOG_LEVEL` | `info` | Application logging level | Helm values |
| `API_TIMEOUT` | `30000` | API request timeout in milliseconds | Helm values |

### Environment Variable Usage
```yaml
env:
- name: BACKEND_URL
  value: "http://{{ include \"todo-chatbot.backend.fullname\" . }}"
- name: PORT
  value: "3000"
- name: NODE_ENV
  value: "production"
```

### Important Notes
- `BACKEND_URL` is automatically set to backend service name via Helm template
- Uses internal cluster DNS for backend communication
- No external URLs needed (backend is internal)

