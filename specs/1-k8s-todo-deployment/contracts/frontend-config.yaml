## Network Configuration

### Service Access
- **External Access**: Via NodePort on port 30080
- **Internal Access**: Via cluster DNS `http://todo-chatbot-frontend`
- **Port Mapping**: Service port 80 → Container port 3000 → NodePort 30080

### Access Methods
1. **Minikube Service Command**:
   ```bash
   minikube service todo-chatbot-frontend -n todo-chatbot
   ```

2. **Direct URL**:
   ```bash
   http://<minikube-ip>:30080
   ```

3. **Port Forward** (alternative):
   ```bash
   kubectl port-forward svc/todo-chatbot-frontend 8080:80 -n todo-chatbot
   ```

### Network Policies (Future)
- Allow ingress from external (NodePort)
- Allow egress to backend service
- Deny all other traffic

