## Static Asset Serving

### Asset Types
- HTML pages
- JavaScript bundles
- CSS stylesheets
- Images and icons
- Fonts

### Caching Strategy
- Static assets should have cache headers
- HTML should not be cached (or short cache)
- Versioned assets can have long cache times

### Compression
- Enable gzip/brotli compression for text assets
- Reduces bandwidth and improves load times

---

## Client-Side Routing

### Requirements
- Support for single-page application (SPA) routing
- All routes should serve index.html
- 404 handling for non-existent routes
- Deep linking support

### Configuration
If using nginx or similar:
```nginx
location / {
  try_files $uri $uri/ /index.html;
}
```

