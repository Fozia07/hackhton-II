# Frontend Service Configuration Contract

**Service**: Frontend Web Application
**Component**: frontend
**Tier**: web
**Version**: 1.0.0

---

## Service Definition

### Metadata
- **Name**: todo-chatbot-frontend
- **Component**: frontend
- **Tier**: web
- **Description**: Frontend web application for Todo AI Chatbot that provides user interface and communicates with backend

### Service Type
- **Type**: NodePort (external access)
- **Port**: 80
- **Target Port**: 3000
- **Node Port**: 30080 (optional, for consistent access)
- **Protocol**: TCP

---

## Deployment Configuration

### Replicas
- **Default**: 2
- **Minimum**: 1
- **Maximum**: 5 (for local Minikube)
- **Rationale**: 2 replicas provide basic HA without excessive resource usage

### Update Strategy
- **Type**: RollingUpdate
- **Max Surge**: 1
- **Max Unavailable**: 0
- **Rationale**: Zero-downtime deployments with gradual rollout

---

## Container Configuration

### Image
- **Repository**: phase4-frontend
- **Tag**: latest
- **Pull Policy**: IfNotPresent
- **Rationale**: Local images in Minikube, no registry pull needed

### Ports
- **Container Port**: 3000
- **Protocol**: TCP
- **Name**: http

---

## Resource Allocation

### Requests (Guaranteed)
- **CPU**: 50m (0.05 CPU cores)
- **Memory**: 64Mi

### Limits (Maximum)
- **CPU**: 100m (0.1 CPU cores)
- **Memory**: 128Mi

### Rationale
- Lighter workload than backend (serves static content)
- Conservative limits suitable for local development
- Allows 2 replicas within typical Minikube resources
- Prevents resource exhaustion

### Resource Calculation (2 replicas)
- **Total Requests**: 100m CPU, 128Mi memory
- **Total Limits**: 200m CPU, 256Mi memory

