## Health Checks

### Liveness Probe
**Purpose**: Detect if container is alive and restart if unhealthy

| Parameter | Value | Rationale |
|-----------|-------|-----------|
| **Type** | HTTP GET | Most informative, checks application health |
| **Path** | `/health` | Standard health check endpoint |
| **Port** | 3000 | Application port |
| **Initial Delay** | 30 seconds | Allow application startup time |
| **Period** | 10 seconds | Check every 10 seconds |
| **Timeout** | 5 seconds | Reasonable for local network |
| **Failure Threshold** | 3 | 30 seconds before restart (3 × 10s) |

**Configuration**:
```yaml
livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
```

### Readiness Probe
**Purpose**: Control traffic routing to healthy pods only

| Parameter | Value | Rationale |
|-----------|-------|-----------|
| **Type** | HTTP GET | Checks if ready to serve traffic |
| **Path** | `/health` | Same endpoint as liveness |
| **Port** | 3000 | Application port |
| **Initial Delay** | 5 seconds | Quick readiness check |
| **Period** | 5 seconds | Frequent checks for traffic control |
| **Timeout** | 3 seconds | Fast response expected |
| **Failure Threshold** | 3 | 15 seconds before removing from service |

**Configuration**:
```yaml
readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
```

### Health Endpoint Requirements
The frontend application MUST implement a `/health` endpoint that:
- Returns HTTP 200 OK when healthy
- Returns HTTP 503 Service Unavailable when unhealthy
- Optionally checks backend connectivity
- Responds within 3 seconds
- Does not perform expensive operations

**Example Response**:
```json
{
  "status": "healthy",
  "timestamp": "2026-02-09T12:00:00Z",
  "backend": "connected"
}
```

