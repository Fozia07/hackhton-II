## Network Configuration

### Service Access
- **Internal Access**: Via cluster DNS `http://todo-chatbot-backend`
- **External Access**: Not exposed (ClusterIP)
- **Port Mapping**: Service port 80 → Container port 8000

### Network Policies (Future)
- Allow ingress from frontend pods only
- Allow egress to Phase II auth service
- Deny all other traffic

