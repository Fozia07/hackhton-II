# Backend Service Configuration Contract

**Service**: Backend API
**Component**: backend
**Tier**: api
**Version**: 1.0.0

---

## Service Definition

### Metadata
- **Name**: todo-chatbot-backend
- **Component**: backend
- **Tier**: api
- **Description**: Backend API service for Todo AI Chatbot that handles business logic and forwards authentication to Phase II service

### Service Type
- **Type**: ClusterIP (internal only)
- **Port**: 80
- **Target Port**: 8000
- **Protocol**: TCP

---

## Deployment Configuration

### Replicas
- **Default**: 2
- **Minimum**: 1
- **Maximum**: 5 (for local Minikube)
- **Rationale**: 2 replicas provide basic HA without excessive resource usage

### Update Strategy
- **Type**: RollingUpdate
- **Max Surge**: 1
- **Max Unavailable**: 0
- **Rationale**: Zero-downtime deployments with gradual rollout

---

## Container Configuration

### Image
- **Repository**: phase4-backend
- **Tag**: latest
- **Pull Policy**: IfNotPresent
- **Rationale**: Local images in Minikube, no registry pull needed

### Ports
- **Container Port**: 8000
- **Protocol**: TCP
- **Name**: http

---

## Resource Allocation

### Requests (Guaranteed)
- **CPU**: 100m (0.1 CPU cores)
- **Memory**: 128Mi

### Limits (Maximum)
- **CPU**: 200m (0.2 CPU cores)
- **Memory**: 256Mi

### Rationale
- Conservative limits suitable for local development
- Allows 2 replicas within typical Minikube resources (4GB RAM)
- Prevents resource exhaustion
- Provides headroom for system components

### Resource Calculation (2 replicas)
- **Total Requests**: 200m CPU, 256Mi memory
- **Total Limits**: 400m CPU, 512Mi memory

